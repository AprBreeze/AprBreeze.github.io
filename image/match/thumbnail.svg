<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Match AI job search thumbnail placeholder">
  <!--
    Temporary thumbnail placeholder for the Match work entry.
    Swap this file for a real product screenshot at the same 4:3 ratio
    (for example image/match/thumbnail.png) and update ux-design.html.
  -->
  <defs>
    <filter id="matchCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1D1D1F" flood-opacity="0.1" />
    </filter>
    <linearGradient id="matchAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E8A85" />
      <stop offset="1" stop-color="#4CC9C2" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#F5F5F7" />

  <circle cx="1040" cy="120" r="260" fill="#0E8A85" opacity="0.08" />
  <circle cx="140" cy="800" r="220" fill="#0E8A85" opacity="0.06" />

  <g filter="url(#matchCardShadow)">
    <rect x="120" y="128" width="960" height="644" rx="40" fill="#FFFFFF" />
  </g>

  <text x="180" y="262" font-family="Manrope, 'DM Sans', Arial, Helvetica, sans-serif" font-size="74" font-weight="700" letter-spacing="-2.5" fill="#0E8A85">Match</text>
  <text x="180" y="312" font-family="'DM Sans', Arial, Helvetica, sans-serif" font-size="27" fill="#6E6E73">Job search, from your resume</text>

  <rect x="180" y="352" width="140" height="4" rx="2" fill="url(#matchAccent)" />

  <!-- Grouped job rows, echoing the results list -->
  <g>
    <rect x="180" y="404" width="840" height="88" rx="16" fill="#F5F5F7" />
    <rect x="180" y="404" width="6" height="88" rx="3" fill="#0E8A85" />
    <rect x="214" y="430" width="300" height="16" rx="8" fill="#C7C7CC" />
    <rect x="214" y="458" width="420" height="12" rx="6" fill="#D8D8DD" />
    <rect x="872" y="433" width="118" height="30" rx="15" fill="#E6F6F5" />

    <rect x="180" y="512" width="840" height="88" rx="16" fill="#F5F5F7" />
    <rect x="214" y="538" width="258" height="16" rx="8" fill="#C7C7CC" />
    <rect x="214" y="566" width="376" height="12" rx="6" fill="#D8D8DD" />

    <rect x="180" y="620" width="840" height="88" rx="16" fill="#F5F5F7" />
    <rect x="214" y="646" width="330" height="16" rx="8" fill="#C7C7CC" />
    <rect x="214" y="674" width="400" height="12" rx="6" fill="#D8D8DD" />
  </g>

  <text x="600" y="840" text-anchor="middle" font-family="'DM Sans', Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2.5" fill="#86868B">THUMBNAIL PLACEHOLDER - REPLACE WITH PRODUCT SCREENSHOT</text>
</svg>
